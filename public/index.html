<style>
:root{
  --ground:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E7EC; --ink:#121A2B; --muted:#5A6477; --rule:#D3D9E1;
  --board:#1D4A38; --board-2:#173D2E; --board-ink:#EEF3EC; --board-dim:#9DB7A9; --board-rule:#2C5E4A; --lead:#F4C542;
  --primary:#1D4A38; --primary-ink:#FFFFFF;
  --dan:#2E6BD6; --dio:#D0542A; --ck:#0E8A7E;
  --accent:#5F1FD1; --accent-soft:#F1EAFE; --accent-ink:#4A14A8; --head:#F5F6F8; --row-hover:#FAFAFC;
  --good:#1E7A4C; --bad:#B42318; --warn-bg:#FFF4D6; --warn-ink:#6B4E00;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E131B; --surface:#161D28; --sunk:#1C2431; --ink:#E5E9F0; --muted:#95A1B5; --rule:#283243;
    --board:#15392B; --board-2:#112F24; --board-ink:#E9F1EA; --board-dim:#8FAE9E; --board-rule:#23503E; --lead:#F2CB55;
    --primary:#3E8C68; --primary-ink:#06140E;
    --dan:#71A2F2; --dio:#F28B60; --ck:#4CC3B5;
    --accent:#A98BFF; --accent-soft:#2A2145; --accent-ink:#CDBDFF; --head:#1B2230; --row-hover:#1A212D;
    --good:#58C08A; --bad:#F2877D; --warn-bg:#3A2F10; --warn-ink:#F5DC94;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E131B; --surface:#161D28; --sunk:#1C2431; --ink:#E5E9F0; --muted:#95A1B5; --rule:#283243;
  --board:#15392B; --board-2:#112F24; --board-ink:#E9F1EA; --board-dim:#8FAE9E; --board-rule:#23503E; --lead:#F2CB55;
  --primary:#3E8C68; --primary-ink:#06140E;
  --dan:#71A2F2; --dio:#F28B60; --ck:#4CC3B5;
    --accent:#A98BFF; --accent-soft:#2A2145; --accent-ink:#CDBDFF; --head:#1B2230; --row-hover:#1A212D;
  --good:#58C08A; --bad:#F2877D; --warn-bg:#3A2F10; --warn-ink:#F5DC94;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--dan);outline-offset:2px}
.num,td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.brand h1{font-size:clamp(40px,7vw,64px);font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.brand p b{font-weight:600;color:var(--ink)}
.track{display:flex;gap:4px;flex-wrap:wrap}
.track .step{display:flex;flex-direction:column;gap:2px;padding:6px 12px 7px;border:1px solid var(--rule);background:var(--surface);min-width:76px}
.track .step span{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.track .step small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.track .step.now{background:var(--board);border-color:var(--board);color:var(--board-ink)}
.track .step.now small{color:var(--lead)}
.track .step.done{opacity:.7}

/* tabs */
.tabs{display:flex;gap:2px;margin:18px 0 22px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);padding:10px 14px;font-size:14px;margin-bottom:16px;border-radius:4px}
.banner b{font-weight:700}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.meta{font-size:13px;color:var(--muted)}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:6px;padding:4px 0 6px;box-shadow:inset 0 0 0 1px var(--board-rule)}
.scroll{overflow-x:auto}
.board table{border-collapse:collapse;width:100%;min-width:760px}
.board th,.board td{padding:10px 12px;text-align:right;white-space:nowrap}
.board thead th{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--board-dim);text-transform:uppercase;border-bottom:1px solid var(--board-rule)}
.board thead tr.grp th{font-size:12px;letter-spacing:.14em;padding-bottom:2px;border-bottom:0;color:var(--board-dim);text-align:center}
.board thead tr.grp th.gh{border-bottom:1px solid var(--board-rule)}
.board th.tm,.board td.tm{text-align:left}
.board td{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--board-rule)}
.board tbody tr:last-child td{border-bottom:0}
.board td.tm{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:.02em}
.board td.tm .tn{display:inline-flex;align-items:center;gap:10px}
.board td.tm .rk{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--board-dim);width:1.4em}
.board td.tm .sw{width:10px;height:10px;border-radius:2px}
.board td.lead{color:var(--lead);font-weight:600}
.board td.pts,.board th.pts{background:var(--board-2)}
.board td.pts{font-family:var(--display);font-size:28px;font-weight:800;color:var(--board-ink)}
.board .sep{border-left:1px solid var(--board-rule)}
.board td.nil{color:var(--board-dim)}
.board td.tie{color:var(--board-ink);font-weight:600}
.board sup{font-family:var(--display);font-size:11px;color:var(--lead);margin-left:2px;letter-spacing:.04em}
.board td.pts.sm{font-size:22px;color:var(--board-dim)}
.rbr{margin-top:22px}
.rbr h3{font-size:22px;font-weight:800;margin-bottom:8px}
.rt{border-collapse:collapse;width:100%;min-width:560px}
.rt th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 10px;border-bottom:1px solid var(--rule)}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:right}
.rt tbody tr:last-child td{border-bottom:0}
.rt td:first-child{font-family:var(--display);font-size:22px;font-weight:800;display:table-cell}
.rt td:first-child .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:middle}
.rt td.dim{color:var(--muted)}
.rt .tot{background:var(--sunk)}
.rbtn{background:none;border:0;padding:2px 4px;font-family:var(--mono);font-size:16px;cursor:pointer;border-radius:3px;font-variant-numeric:tabular-nums}
.rbtn:hover{background:var(--sunk);text-decoration:underline}
.rt td.top .rbtn{font-weight:600;box-shadow:inset 0 -2px 0 var(--c)}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0;max-width:72ch}

.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.mini{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px}
.mini h3{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}
.mini h3 .sw{width:10px;height:10px;border-radius:2px}
.mini .best{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.mini .best li{display:grid;gap:1px}
.mini .best li>span:first-child{font-weight:600}
.mini .best li>span:last-child{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.mini .best li.empty{color:var(--muted)}


/* yahoo-style standings */
.ycard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin-bottom:18px;overflow:hidden}
.yhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 18px 10px}
.yhead h2{font-family:var(--body);font-size:18px;font-weight:700;letter-spacing:-.01em}
.yhead h2 .sub{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.ytabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--rule);overflow-x:auto}
.ytab{background:none;border:0;padding:10px 8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ytab:hover{color:var(--ink)}
.ytab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.yt{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.yt th{background:var(--head);color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
.yt th.l,.yt td.l{text-align:left}
.yt td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
.yt tbody tr:last-child td{border-bottom:0}
.yt tbody tr:hover td{background:var(--row-hover)}
.yt .sep{border-left:1px solid var(--rule)}
.yt tr.grp th{background:var(--surface);font-size:10.5px;letter-spacing:.12em;text-align:center;border-bottom:0;padding:8px 12px 2px}
.yt tr.grp th.gh{border-bottom:2px solid var(--accent)}
.st td{padding:12px}
.st .rk{font-weight:700;width:52px;color:var(--muted)}
.st tr.first .rk{color:var(--accent-ink)}
.st .rec{font-weight:700;font-size:15px}
.st .won{color:var(--muted);font-size:12.5px;text-align:left;white-space:normal;min-width:140px}
.st th:last-child{text-align:left}
.tmc{display:inline-flex;align-items:center;gap:10px}
.tmc>span:last-child{display:grid;line-height:1.25}
.tmc b{font-weight:700;font-size:15px}
.tmc small{color:var(--muted);font-size:12px}
.tmc.sm b{font-size:14px}
.av{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.02em;flex:none}
.tmc.sm .av{width:26px;height:26px;font-size:10.5px}
.cs{min-width:720px}
.cs td{font-family:var(--mono);font-size:14px}
.cs td i{font-style:normal;font-family:var(--body);font-size:10px;font-weight:700;color:var(--muted);margin-left:3px;vertical-align:super}
.cs td.nil,.rt td.nil{color:var(--muted)}
.legend{display:flex;gap:6px}
.key{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.key.win{background:var(--accent-soft);color:var(--accent-ink)}
.key.tie{background:var(--sunk);color:var(--muted)}
.ycard .note{padding:0 18px 14px;margin-top:10px}
.rt{min-width:520px}
.rt .tot{background:var(--head)}
.rt td.win .rbtn{color:var(--accent-ink);font-weight:700}
.rbtn{background:none;border:0;padding:2px 4px;font-family:var(--mono);font-size:14px;cursor:pointer;border-radius:3px;color:inherit}
.rbtn:hover{text-decoration:underline}
.mini h3.tmc{font-family:var(--body);font-size:15px;font-weight:700}
@media (max-width:640px){.hide-s{display:none}}

/* rosters */
.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.team{background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.team>header{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px;border-top:4px solid var(--c)}
.team>header h2{font-size:28px;font-weight:800}
.team>header .meta{font-family:var(--mono)}
.grp-l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 14px 4px;border-top:1px solid var(--rule);background:var(--sunk)}
.plr{border-top:1px solid var(--rule)}
.plr>button{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer}
.plr>button:hover{background:var(--sunk)}
.slot{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 5px;border-radius:3px;background:var(--sunk);color:var(--muted);min-width:28px;text-align:center}
.plr .nm{font-weight:600;overflow-wrap:anywhere}
.plr .nm small{font-weight:400;color:var(--muted);margin-left:4px}
.plr .ln{grid-column:2 / 4;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.plr .gp{font-family:var(--mono);font-size:12px;color:var(--muted)}
.plr.empty{padding:10px 14px;color:var(--muted);font-size:14px}
.detail{padding:4px 14px 14px;background:var(--sunk)}
.gl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}
.gl th,.gl td{padding:4px 4px;text-align:right;white-space:nowrap}
.gl th{font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule)}
.gl th:first-child,.gl td:first-child{text-align:left}
.gl td{font-family:var(--mono)}
.gl tfoot td{border-top:1px solid var(--rule);font-weight:600}
.tag{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 4px;border-radius:3px;background:var(--rule);color:var(--muted)}
.tag.live{background:var(--board);color:var(--lead)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px;font-size:14px}
.x:hover{color:var(--bad)}
.lf{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;align-items:end}
.lf label{display:grid;gap:2px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.lf label.wide{grid-column:span 2}
.lf input{width:100%;padding:5px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);font-family:var(--mono);font-size:13px}
.lf .go{grid-column:1 / -1;display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:4px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink);font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:13px}

/* draft */
.draft{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px}
.panel h3{font-size:22px;font-weight:800;margin-bottom:10px}
.clock{border-top:4px solid var(--c);}
.clock .who{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;margin:2px 0 4px;color:var(--c)}
.clock .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:grid;gap:4px;margin-top:12px}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{padding:8px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);width:100%}
.seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg label{position:relative;flex:1;text-align:center;padding:8px 4px;cursor:pointer;font-weight:600;font-size:14px;border-left:1px solid var(--rule)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--ground)}
.seg label:has(input:disabled){opacity:.35;cursor:not-allowed;text-decoration:line-through}
.seg label:has(input:focus-visible){outline:2px solid var(--dan);outline-offset:-2px}
.seg label small{display:block;font-weight:400;font-size:11px;opacity:.8}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.used{margin-top:14px;font-size:13px;color:var(--muted)}
.used b{color:var(--ink);font-weight:600}
.order{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.order select{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);width:100%}

.bd{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.bd th{font-family:var(--display);font-size:22px;font-weight:800;text-align:left;padding:6px 8px;border-bottom:3px solid var(--c)}
.bd td{padding:6px;vertical-align:top;width:33.3%}
.bd td .cell{border:1px solid var(--rule);border-radius:4px;padding:6px 8px;min-height:52px;background:var(--surface)}
.bd td .cell .pk{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.bd td .cell .pn{font-weight:600;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.bd td .cell.open{background:transparent;border-style:dashed}
.bd td .cell.clk{border:2px solid var(--c);background:var(--sunk)}
.bd td .cell.clk .pn{color:var(--c)}
.bd .rl{font-family:var(--mono);font-size:11px;color:var(--muted);width:auto;padding-right:0;vertical-align:middle;white-space:nowrap}
.bdhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}


.dteams{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px}
.dteam>header{padding:10px 12px}
.dteam>header h2{font-size:24px}
.dteam.onclk{box-shadow:0 0 0 2px var(--c)}
.clkpill{background:var(--c);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.dslot{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--rule);min-height:44px}
.dslot .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.dslot .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.dslot .pk{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dslot.empty .nm{color:var(--muted);font-weight:400;font-style:italic}
.dslot.empty.next{background:var(--sunk)}
.dslot.empty.next .nm{color:var(--c);font-style:normal;font-weight:600}

    <button role="tab" id="tab-draft" data-tab="draft"><span class="lg">Draft room</span><span class="sh">Draft</span></button>
  </nav>

  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const MANAGERS=['Dan','Dio','CK'];
const ROUNDS=[
  {id:'WC',name:'Wild Card',short:'WC'},
  {id:'DS',name:'Division Series',short:'DS'},
  {id:'CS',name:'LCS',short:'LCS'},
  {id:'WS',name:'World Series',short:'WS'}];
const RN=Object.fromEntries(ROUNDS.map(r=>[r.id,r]));
const SLOTS={H:3,SP:2,RP:1};
const SLOT_NAME={H:'Hitter',SP:'Starter',RP:'Reliever'};
const PER_TEAM=6, PER_ROUND=18;
const INITIALS={Dan:'DM',Dio:'CD',CK:'CK'};
const lastName=n=>{const t=String(n).split(/\s+/).filter(x=>!/^(jr\.?|sr\.?|ii|iii|iv|v)$/i.test(x)); if(t.length<2) return n; const pre=t[t.length-2].toLowerCase(); return (['de','la','del','van','von','da','dos','st.'].includes(pre)&&t.length>2?t.slice(-2).join(' '):t[t.length-1]);};
const MANAGER_TEAMS={Dan:'Team Dan',Dio:'Team Dio',CK:'Team CK'};
const TEAMS=['ATH','ATL','AZ','BAL','BOS','CHC','CIN','CLE','COL','CWS','DET','HOU','KC','LAA','LAD','MIA','MIL','MIN','NYM','NYY','PHI','PIT','SD','SEA','SF','STL','TB','TEX','TOR','WSH'];
const HF=['ab','h','d','t','hr','r','rbi','sb','bb','hbp','sf'];
const PF=['outs','h','er','bb','k','w','sv','hld'];
const HLBL={ab:'AB',h:'H',d:'2B',t:'3B',hr:'HR',r:'R',rbi:'RBI',sb:'SB',bb:'BB',hbp:'HBP',sf:'SF'};
const PLBL={outs:'IP',h:'H',er:'ER',bb:'BB',k:'K',w:'W',sv:'SV',hld:'HLD'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const ipStr=o=>Math.floor(o/3)+'.'+(o%3);
function parseIP(v){v=String(v||'').trim(); if(!v) return 0; if(!/^\d+(\.[012])?$/.test(v)) return null; const [w,f]=v.split('.'); return (+w)*3+(+(f||0));}
const fOPS=v=>v==null?'—':(v<1?v.toFixed(3).replace(/^0/,''):v.toFixed(3));
const f2=v=>v==null?'—':v.toFixed(2);
const store=(k,v)=>{try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}};

/* ---------- state ---------- */
let db=null, canWrite=false, loaded={picks:false,lines:false};
const S={picks:[],lines:[],league:{orders:{}},sync:null,rosters:{}};
const UI={pkTeam:'',pkPlayer:'',pkSlot:'',tab:store('os.tab')||'standings', standRound:'ALL', rosterRound:null, draftRound:null, open:new Set(), err:''};
if(!['standings','rosters','draft'].includes(UI.tab)) UI.tab='standings';

/* ---------- example league (shown only until the first real pick) ---------- */
const DEMO=(()=>{
  const P=[
    ['Dan','Shohei Ohtani','LAD','H'],['Dio','Aaron Judge','NYY','H'],['CK','Tarik Skubal','DET','SP'],
    ['CK','Cal Raleigh','SEA','H'],['Dio','Zack Wheeler','PHI','SP'],['Dan','Yoshinobu Yamamoto','LAD','SP'],
    ['Dan','Kyle Schwarber','PHI','H'],['Dio','Juan Soto','NYM','H'],['CK','José Ramírez','CLE','H'],
    ['CK','Logan Webb','SF','SP'],['Dio','Garrett Crochet','BOS','SP'],['Dan','Pete Crow-Armstrong','CHC','H'],
    ['Dan','Hunter Brown','HOU','SP'],['Dio','Mason Miller','SD','RP'],['CK','Bobby Witt Jr.','KC','H'],
    ['CK','Andrés Muñoz','SEA','RP'],['Dio','Gunnar Henderson','BAL','H'],['Dan','Josh Hader','HOU','RP']];
  const picks=P.map((p,i)=>({id:'demo'+i,round:'WC',n:i+1,manager:p[0],name:p[1],team:p[2],slot:p[3],key:norm(p[1])}));
  const H={
    'Shohei Ohtani':[12,4,1,0,2,4,5,1,3,0,0],'Aaron Judge':[11,3,0,0,1,2,3,0,4,0,0],'Cal Raleigh':[12,3,1,0,1,2,4,0,1,0,1],
    'Kyle Schwarber':[11,2,0,0,2,3,4,0,3,0,0],'Juan Soto':[10,4,1,0,1,3,2,1,4,0,0],'José Ramírez':[12,5,2,0,0,2,1,2,1,0,0],
    'Pete Crow-Armstrong':[11,3,1,1,0,2,2,3,0,1,0],'Bobby Witt Jr.':[13,4,1,0,1,3,2,2,0,0,0],'Gunnar Henderson':[12,2,0,0,0,1,1,0,2,0,0]};
  const Pp={'Tarik Skubal':[20,4,1,1,13,1,0,0],'Zack Wheeler':[18,6,3,2,9,1,0,0],'Yoshinobu Yamamoto':[19,5,2,1,8,1,0,0],
    'Logan Webb':[17,7,3,1,6,0,0,0],'Garrett Crochet':[18,5,2,2,10,0,0,0],'Hunter Brown':[16,6,4,3,7,0,0,0],
    'Mason Miller':[5,1,0,1,4,0,2,0],'Andrés Muñoz':[4,2,1,0,3,0,1,1],'Josh Hader':[3,1,0,1,3,0,1,0]};
  const lines=[];
  picks.forEach(p=>{
    const a=(p.slot==='H'?H:Pp)[p.name]; const F=p.slot==='H'?HF:PF; const o={id:'dl'+p.key,round:'WC',key:p.key,game:'WC totals'};
    F.forEach((f,i)=>o[f]=a[i]); lines.push(o);});
  return {picks,lines};
})();
const isDemo=()=>loaded.picks&&S.picks.length===0 || !db;
const D=()=>isDemo()?DEMO:S;

/* ---------- derived ---------- */
const orderFor=r=>{const o=S.league.orders&&S.league.orders[r]; return (Array.isArray(o)&&o.length===3&&MANAGERS.every(m=>o.includes(m)))?o:MANAGERS.slice();};
const pickSlotIndex=(i,order)=>{const rr=Math.floor(i/3),pos=i%3;return order[rr%2===0?pos:2-pos];};
const picksIn=(src,r)=>src.picks.filter(p=>p.round===r).sort((a,b)=>a.n-b.n);
function roundStatus(r){
  const n=picksIn(S,r).length; const idx=ROUNDS.findIndex(x=>x.id===r);
  const later=ROUNDS.slice(idx+1).some(x=>picksIn(S,x.id).length>0);
  if(n===0) return later?'Skipped':'Upcoming';
  if(n<PER_ROUND) return 'Drafting';
  return later?'Final':'Live';
}
function currentRound(){
  let cur='WC';
  ROUNDS.forEach(r=>{if(picksIn(S,r.id).length>0) cur=r.id;});
  return cur;
}
function draftRoundDefault(){
  for(const r of ROUNDS){ if(picksIn(S,r.id).length<PER_ROUND) return r.id; }
  return 'WS';
}
function playerAgg(src,round,key,slot){
  const F=slot==='H'?HF:PF; const a={}; F.forEach(f=>a[f]=0); let g=0;
  src.lines.forEach(l=>{ if(l.round===round&&l.key===key){ g++; F.forEach(f=>a[f]+=(+l[f]||0)); }});
  a.games=g; return a;
}
function teamAgg(src,round){
  const h={},p={}; HF.forEach(f=>h[f]=0); PF.forEach(f=>p[f]=0);
  const T={}; MANAGERS.forEach(m=>{T[m]={h:{...h},p:{...p}};});
  src.picks.forEach(pk=>{
    if(round!=='ALL'&&pk.round!==round) return;
    const t=T[pk.manager]; if(!t) return;
    const a=playerAgg(src,pk.round,pk.key,pk.slot);
    if(pk.slot==='H') HF.forEach(f=>t.h[f]+=a[f]); else PF.forEach(f=>t.p[f]+=a[f]);
  });
  return T;
}
const ops=h=>{const pa=h.ab+h.bb+h.hbp+h.sf; if(!pa) return null; const obp=(h.h+h.bb+h.hbp)/pa; const tb=h.h+h.d+2*h.t+3*h.hr; return obp+(h.ab?tb/h.ab:0);};
const era=p=>p.outs?p.er*27/p.outs:null;
const whip=p=>p.outs?(p.bb+p.h)*3/p.outs:null;
const CATS=[
  {k:'R',v:t=>t.h.r},{k:'HR',v:t=>t.h.hr},{k:'RBI',v:t=>t.h.rbi},{k:'SB',v:t=>t.h.sb},{k:'OPS',v:t=>ops(t.h),fmt:fOPS},
  {k:'W',v:t=>t.p.w,sep:true},{k:'K',v:t=>t.p.k},{k:'ERA',v:t=>era(t.p),fmt:f2,low:true},{k:'WHIP',v:t=>whip(t.p),fmt:f2,low:true},{k:'SV+H',v:t=>t.p.sv+t.p.hld}];
function scoreboard(src,round){
  const T=teamAgg(src,round); const rows=MANAGERS.map(m=>({m,vals:{},w:0,l:0,t:0,res:{}}));
  CATS.forEach(c=>{
    rows.forEach(r=>{r.vals[c.k]=c.v(T[r.m]);});
    const score=v=>v==null?null:(c.low?-v:v);
    const sc=rows.map(r=>score(r.vals[c.k])).filter(v=>v!=null);
    // a category nobody has stats in yet isn't decided
    if(!sc.length||(c.k!=='OPS'&&c.k!=='ERA'&&c.k!=='WHIP'&&rows.every(r=>!r.vals[c.k]))) return;
    const best=Math.max(...sc);
    const leaders=rows.filter(r=>{const v=score(r.vals[c.k]);return v!=null&&Math.abs(v-best)<1e-9;});
    rows.forEach(r=>{
      if(!leaders.includes(r)){r.l++; r.res[c.k]='L';}
      else if(leaders.length===1){r.w++; r.res[c.k]='W';}
      else {r.t++; r.res[c.k]='T';}
    });
  });
  rows.sort((a,b)=>b.w-a.w||b.t-a.t||MANAGERS.indexOf(a.m)-MANAGERS.indexOf(b.m));
  return rows;
}
const rec=r=>`${r.w}-${r.l}-${r.t}`;
function hitLine(a){
  if(!a.games) return 'No games yet';
  const bits=[`${a.h}-for-${a.ab}`];
  if(a.hr) bits.push(`${a.hr} HR`); if(a.r) bits.push(`${a.r} R`); if(a.rbi) bits.push(`${a.rbi} RBI`); if(a.sb) bits.push(`${a.sb} SB`);
  bits.push(`${fOPS(ops(a))} OPS`); return bits.join(', ');
}
function pitLine(a){
  if(!a.games) return 'No games yet';
  const bits=[`${ipStr(a.outs)} IP`,`${a.k} K`,`${f2(era(a))} ERA`,`${f2(whip(a))} WHIP`];
  if(a.w) bits.push(`${a.w} W`); if(a.sv) bits.push(`${a.sv} SV`); if(a.hld) bits.push(`${a.hld} HLD`);
  return bits.join(', ');
}
function needs(round,m){
  const mine=picksIn(S,round).filter(p=>p.manager===m); const left={};
  Object.keys(SLOTS).forEach(s=>left[s]=SLOTS[s]-mine.filter(p=>p.slot===s).length); return left;
}

/* ---------- render ---------- */
function renderTrack(){ if(!document.getElementById('track')) return;
  const cur=currentRound();
  $('#track').innerHTML=ROUNDS.map(r=>{const st=db&&loaded.picks?roundStatus(r.id):(r.id==='WC'?'Upcoming':'Upcoming');
    const cls=r.id===cur?'now':(st==='Final'?'done':'');
    return `<div class="step ${cls}"><span>${r.short}</span><small>${st}</small></div>`;}).join('');
}
function syncLine(){
  if(isDemo()) return '';
  if(!S.sync||!S.sync.at) return 'Stats not entered yet';
  const d=new Date(S.sync.at); const t=isNaN(d)?'':d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  return `Stats updated ${esc(t)}${S.sync.by==='auto'?' · automatic':S.sync.by?' · '+esc(S.sync.by):''}`;
}
function demoBanner(){
  if(!isDemo()) return '';
  const why=db?'Your real standings take over as soon as the first Wild Card pick is made in the Draft room.':'The league data couldn’t be loaded right now, so example numbers are shown.';
  return `<div class="banner"><div><b>Example numbers.</b> These rosters and stats are made up to show how the page works. ${why}</div></div>`;
}
function roundChips(sel,attr,withAll){
  const opts=(withAll?[{id:'ALL',name:'All rounds'}]:[]).concat(ROUNDS);
  return `<div class="chips">${opts.map(o=>`<button class="chip" ${attr}="${o.id}" aria-pressed="${sel===o.id}"><span class="lg">${esc(o.name)}</span><span class="sh">${esc(o.id==='ALL'?'All':o.short)}</span></button>`).join('')}</div>`;
}
function renderStandings(){
  const src=D(); const round=UI.standRound;
  const rows=scoreboard(src,round);
  const lead=rows[0];
  const gb=r=>{const g=((lead.w-r.w)+(r.l-lead.l))/2; return r===lead||g<=0?'–':(Number.isInteger(g)?g:g.toFixed(1));};
  const pct=r=>{const n=r.w+r.l+r.t; if(!n) return '.000'; const v=(r.w+r.t/2)/n; return v>=1?'1.000':v.toFixed(3).replace(/^0/,'');};
  const av=m=>`<span class="av c-${m}">${INITIALS[m]||m.slice(0,2).toUpperCase()}</span>`;
  const tabs=`<div class="ytabs" role="tablist">${[{id:'ALL',name:'Season'}].concat(ROUNDS).map(o=>`<button class="ytab" data-sr="${o.id}" aria-selected="${round===o.id}"><span class="lg">${esc(o.id==='ALL'?'Overall':o.name)}</span><span class="sh">${esc(o.id==='ALL'?'All':o.short)}</span></button>`).join('')}</div>`;
  const st=`<table class="yt st"><thead><tr><th class="l">Rank</th><th class="l">Team</th><th>W-L-T</th><th>Pct</th><th>GB</th><th class="hide-s">Cats won</th></tr></thead><tbody>${
    rows.map((r,i)=>{const rank=rows.findIndex(x=>x.w===r.w&&x.t===r.t)+1;
      const won=CATS.filter(c=>r.res[c.k]==='W').map(c=>c.k).join(', ')||'—';
      return `<tr${i===0&&(r.w||r.t)?' class="first"':''}><td class="l rk">${rank}</td><td class="l"><span class="tmc">${av(r.m)}<span><b>${r.m}</b><small>${esc(MANAGER_TEAMS[r.m])}</small></span></span></td><td class="rec">${rec(r)}</td><td>${pct(r)}</td><td>${gb(r)}</td><td class="hide-s won">${won}</td></tr>`;}).join('')
  }</tbody></table>`;
  const cs=`<table class="yt cs"><thead><tr class="grp"><th></th><th colspan="5" class="gh">Batting</th><th colspan="5" class="gh sep">Pitching</th></tr><tr><th class="l">Team</th>${CATS.map(c=>`<th class="${c.sep?'sep':''}">${c.k}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr><td class="l"><span class="tmc sm">${av(r.m)}<b>${r.m}</b></span></td>${CATS.map(c=>{const v=r.vals[c.k]; const txt=c.fmt?c.fmt(v):v; const rs=r.res[c.k];
      return `<td class="${c.sep?'sep ':''}${rs==='W'?'win':rs==='T'?'tie':''}${v==null?' nil':''}">${txt}</td>`;}).join('')}</tr>`).join('')
  }</tbody></table>`;
  // round-by-round records
  const recs={}; const cols=[...ROUNDS.map(x=>x.id),'ALL'];
  cols.forEach(id=>{recs[id]={}; scoreboard(src,id).forEach(r=>recs[id][r.m]=r);});
  const played=id=>id==='ALL'||src.picks.some(p=>p.round===id);
  const allRows=scoreboard(src,'ALL');
  const rbr=`<table class="yt rt"><thead><tr><th class="l">Team</th>${ROUNDS.map(x=>`<th>${x.short}</th>`).join('')}<th class="tot">Overall</th></tr></thead><tbody>${
    allRows.map(r=>`<tr><td class="l"><span class="tmc sm">${av(r.m)}<b>${r.m}</b></span></td>${cols.map(id=>{
      if(!played(id)) return `<td class="nil${id==='ALL'?' tot':''}">–</td>`;
      const x=recs[id][r.m]; const top=Math.max(...MANAGERS.map(m=>recs[id][m].w));
      return `<td class="${id==='ALL'?'tot ':''}${x.w===top&&top>0?'win':''}"><button class="rbtn" data-sr="${id}">${rec(x)}</button></td>`;}).join('')}</tr>`).join('')
  }</tbody></table>`;
  // top performers
  const best=MANAGERS.map(m=>{
    const ps=src.picks.filter(p=>p.manager===m&&(round==='ALL'||p.round===round));
    const hs=ps.filter(p=>p.slot==='H').map(p=>({p,a:playerAgg(src,p.round,p.key,'H')})).filter(x=>x.a.games).sort((x,y)=>(y.a.r+y.a.hr*2+y.a.rbi+y.a.sb)-(x.a.r+x.a.hr*2+x.a.rbi+x.a.sb));
    const pc=ps.filter(p=>p.slot!=='H').map(p=>({p,a:playerAgg(src,p.round,p.key,p.slot)})).filter(x=>x.a.games).sort((x,y)=>(y.a.k+y.a.w*5+(y.a.sv+y.a.hld)*4-y.a.er*2)-(x.a.k+x.a.w*5+(x.a.sv+x.a.hld)*4-x.a.er*2));
    const li=[];
    if(hs[0]) li.push(`<li><span>${esc(hs[0].p.name)} <span class="meta">${RN[hs[0].p.round].short}</span></span><span>${hitLine(hs[0].a)}</span></li>`);
    if(pc[0]) li.push(`<li><span>${esc(pc[0].p.name)} <span class="meta">${RN[pc[0].p.round].short}</span></span><span>${pitLine(pc[0].a)}</span></li>`);
    if(!li.length) li.push('<li class="empty">No stats yet</li>');
    return `<div class="mini"><h3 class="tmc">${av(m)}<span>${m}’s top performers</span></h3><ul class="best">${li.join('')}</ul></div>`;
  }).join('');
  const label=round==='ALL'?'Overall':RN[round].name;
  return `${demoBanner()}
  <section class="ycard">
    <header class="yhead"><h2>Standings</h2><span class="meta">${syncLine()}</span></header>
    ${tabs}
    <div class="scroll">${st}</div>
  </section>
  <section class="ycard">
    <header class="yhead"><h2>Category totals <span class="sub">${esc(label)}</span></h2><span class="legend"><span class="key win">Leader</span><span class="key tie">Tied for lead</span></span></header>
    <div class="scroll only-wide">${cs}</div>
    <table class="yt csm only-phone"><thead><tr><th class="l">Cat</th>${rows.map(r=>`<th><span class="tmc sm">${av(r.m)}<b class="cn">${r.m}</b></span></th>`).join('')}</tr></thead><tbody>${
      CATS.map(c=>`<tr${c.sep?' class="psep"':''}><td class="l ckey">${c.k}</td>${rows.map(r=>{const v=r.vals[c.k]; const rs=r.res[c.k]; return `<td class="${rs==='W'?'win':rs==='T'?'tie':''}${v==null?' nil':''}">${c.fmt?c.fmt(v):v}</td>`;}).join('')}</tr>`).join('')
    }</tbody></table>
  </section>
  <section class="ycard">
    <header class="yhead"><h2>Round by round</h2><span class="meta">Tap a record to view that round</span></header>
    <div class="scroll">${rbr}</div>
  </section>
  <div class="split">${best}</div>`;
}
function renderRosters(){
  const src=D(); const round=UI.rosterRound||(isDemo()?'WC':currentRound());
  const editable=false;
  const cols=MANAGERS.map(m=>{
    const ps=picksIn(src,round).filter(p=>p.manager===m);
    const grp=(slot,title)=>{
      const list=ps.filter(p=>p.slot===slot);
      let html=`<div class="grp-l">${title}</div>`;
      for(let i=0;i<SLOTS[slot];i++){
        const p=list[i];
        if(!p){ html+=`<div class="plr empty">Open ${SLOT_NAME[slot].toLowerCase()} slot</div>`; continue; }
        const a=playerAgg(src,round,p.key,p.slot); const ok=`${round}|${p.key}`; const open=UI.open.has(ok);
        html+=`<div class="plr"><button data-open="${esc(ok)}" aria-expanded="${open}"><span class="slot">${p.slot}</span><span class="nm">${esc(p.name)}<small>${esc(p.team||'')}</small></span><span class="gp">${a.games} G</span><span class="ln">${p.slot==='H'?hitLine(a):pitLine(a)}</span></button>${open?detail(src,p,editable):''}</div>`;
      }
      return html;
    };
    const T=teamAgg(src,round)[m];
    return `<section class="team c-${m}"><header><h2>${m}</h2><span class="meta">${ps.length}/${PER_TEAM} drafted</span></header>
      ${grp('H','Hitters')}${grp('SP','Starting pitchers')}${grp('RP','Relief pitcher')}
      <div class="grp-l" style="display:flex;justify-content:space-between"><span>${RN[round].short} total</span><span class="num">${T.h.r} R · ${T.h.hr} HR · ${T.p.k} K</span></div></section>`;
  }).join('');
  return `${demoBanner()}
  <div class="bar">${roundChips(round,'data-rr',false)}<span class="meta">${syncLine()}</span></div>
  <div class="teams">${cols}</div>
  <p class="note">Tap a player to see game-by-game lines. Box scores fill in automatically during games${editable?' — add a line by hand only to fix something the automatic update missed':''}. Each player’s stats only count for the round they were drafted in.</p>`;
}
function detail(src,p,editable){
  const F=p.slot==='H'?HF:PF, L=p.slot==='H'?HLBL:PLBL;
  const ls=src.lines.filter(l=>l.round===p.round&&l.key===p.key).sort((a,b)=>String(a.date||a.game||'').localeCompare(String(b.date||b.game||'')));
  const cell=(f,v)=>f==='outs'?ipStr(+v||0):(+v||0);
  const a=playerAgg(src,p.round,p.key,p.slot);
  let t=`<div class="scroll only-wide"><table class="gl"><thead><tr><th>Game</th>${F.map(f=>`<th>${L[f]}</th>`).join('')}${editable?'<th></th>':''}</tr></thead><tbody>`;

const isPitcherPos=pos=>pos==='P'||pos==='SP'||pos==='RP';

function snapshotInputs(){

/* ---------- boot: Netlify API ---------- */
async function getJSON(u){ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }
function getPin(){ try{ return localStorage.getItem('league-pin')||''; }catch(e){ return ''; } }
function setPin(v){ try{ localStorage.setItem('league-pin',v); }catch(e){} }
async function api(action,body,retried){
  const r=await fetch('/api/league',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,pin:getPin(),...body})});
  if(r.status===401){
    if(retried){ const e=new Error('pin'); e.code='pin'; throw e; }
    const v=window.prompt('Enter the league PIN to make changes:'); if(!v){ const e=new Error('pin'); e.code='pin'; throw e; }
    setPin(v.trim()); return api(action,body,true);
  }
  const data=await r.json().catch(()=>({}));
  if(r.status===409){ const e=new Error(data.error||'conflict'); e.code='conflict'; throw e; }
  if(!r.ok){ const e=new Error(data.error||'Something went wrong.'); e.code='rejected'; throw e; }
  applyLeague(data); return data;
}
function applyLeague(d){
  if(!d||!Array.isArray(d.picks)) return;
  S.picks=d.picks.filter(p=>RN[p.round]&&MANAGERS.includes(p.manager));
  S.league={orders:d.orders||{}}; loaded.picks=true; render();
}
async function loadLeague(){ try{ applyLeague(await getJSON('/api/league')); db=db||true; }catch(e){} }
async function loadStats(){ try{ const d=await getJSON('/api/stats'); S.lines=d.lines||[]; S.sync=d.fetchedAt?{at:new Date(d.fetchedAt).toISOString(),by:'auto'}:null; loaded.lines=true; render(); }catch(e){} }
render();
(async()=>{
  try{ const r=await getJSON('/rosters.json'); S.rosters=r; }catch(e){}
  try{ applyLeague(await getJSON('/api/league')); db=true; canWrite=true; }catch(e){ db=null; loaded.picks=true; render(); return; }
  loadStats();
  let lastL=Date.now(), lastS=Date.now();
  setInterval(()=>{
    if(document.hidden) return;
    const now=Date.now();
    const leagueEvery=UI.tab==='draft'?6000:45000;
    if(now-lastL>=leagueEvery){ lastL=now; loadLeague(); }
    if(now-lastS>=60000){ lastS=now; loadStats(); }
  },2000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ loadLeague(); loadStats(); } });
})();
})();
</script>
